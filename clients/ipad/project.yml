# Generated into an .xcodeproj by XcodeGen, so the project file itself never
# goes in the repository: an .xcodeproj is a large plist that only one person
# can merge, and this is eleven readable lines instead.
#
#   brew install xcodegen && ./build.sh
name: ChurchViewerRemote
options:
  bundleIdPrefix: com.churchviewer
  deploymentTarget:
    iOS: "17.0"

targets:
  ChurchViewerRemote:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ChurchViewer
        UILaunchScreen: {}
        # A phone is held whichever way the person is standing; a tablet on a
        # music stand is usually landscape. Both, on both.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # It talks to one https server; no transport exceptions wanted.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    # Signing lives in Local.xcconfig, which build.sh writes and git ignores.
    # It has to be a file rather than a setting typed into Xcode, because this
    # project is regenerated from this spec on every build — anything set in the
    # UI would be wiped the next time somebody ran the script.
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CV_BUNDLE_ID)
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: $(CV_TEAM)
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Only the simulator goes unsigned. A device needs a real signature,
        # and disabling it here is what produced "no team found".
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
