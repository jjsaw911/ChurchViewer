# Generated into an .xcodeproj by XcodeGen, so the project file itself never
# goes in the repository: an .xcodeproj is a large plist that only one person
# can merge, and this is eleven readable lines instead.
#
#   brew install xcodegen && ./build.sh
name: ChurchViewerRemote
options:
  bundleIdPrefix: com.churchviewer
  deploymentTarget:
    iOS: "17.0"

targets:
  ChurchViewerRemote:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ChurchViewer
        UILaunchScreen: {}
        # iPhone: no upside-down. A phone handed over mid-service should never
        # be the thing that's the wrong way up.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # It talks to one https server; no transport exceptions wanted.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.churchviewer.remote
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # 1,2 = iPhone and iPad. The person running the service has a phone on
        # them every week and an iPad only sometimes.
        TARGETED_DEVICE_FAMILY: "1,2"
        # Nothing is signed for the simulator; a real device needs a team here.
        CODE_SIGNING_ALLOWED: NO
