# /etc/nginx/sites-available/churchviewer
#
# Tenant routing happens inside the app — src/proxy.ts reads the Host header —
# so nginx only has to pass the original Host through untouched. Rewrite it to
# the upstream name and every church site renders the marketing page instead.
#
# SERVER NAMES: these are the names the certificate actually covers. A wildcard
# would be nicer, but Let's Encrypt only issues wildcards over the DNS-01
# challenge, which needs a DNS plugin for the zone (Namecheap here, not Cloud
# DNS). Until then, each new church needs its own A record AND its name added
# to both the server_name lines below and the certbot -d list. See deploy/README.

upstream churchviewer_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name churchviewer.com www.churchviewer.com citychurch.churchviewer.com;

    # Certbot renews over the webroot challenge; this must stay reachable on 80.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name churchviewer.com www.churchviewer.com citychurch.churchviewer.com;

    ssl_certificate     /etc/letsencrypt/live/churchviewer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/churchviewer.com/privkey.pem;

    # Written out rather than included: `certbot certonly` doesn't install
    # options-ssl-nginx.conf — only the --nginx installer plugin does.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Recordings upload straight to Cloud Storage over signed URLs, so request
    # bodies here stay small. Raised a little for the transcribe endpoint.
    client_max_body_size 25m;

    # Transcription requests can sit a while before the first byte.
    proxy_read_timeout    300s;
    proxy_connect_timeout 10s;

    location /_next/static/ {
        proxy_pass       http://churchviewer_app;
        proxy_set_header Host $host;
        # Content-addressed by build id, so it can be cached hard.
        add_header       Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass         http://churchviewer_app;
        proxy_http_version 1.1;

        # THE important line — see the note at the top of this file.
        proxy_set_header   Host              $host;

        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_buffering    off;
    }
}
